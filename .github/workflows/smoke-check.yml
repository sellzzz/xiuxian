name: Qingyun smoke check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  smoke-check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run smoke check
        shell: pwsh
        run: ./tests/smoke-check.ps1
